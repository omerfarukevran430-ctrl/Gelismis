<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ömer Studio 3 | Pro Launcher</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #121212;
            --bg-side: #181818;
            --bg-card: #202020;
            --bg-hover: #2a2a2a;
            --accent: #0078f2;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SOL NAVİGASYON --- */
        .sidebar {
            width: 220px;
            background-color: var(--bg-side);
            display: flex;
            flex-direction: column;
            padding: 20px 10px;
            border-right: 1px solid #252525;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 40px;
            padding-left: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.2s;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--bg-hover);
            color: white;
        }

        .nav-item.active { border-left: 3px solid var(--accent); }

        /* --- ANA İÇERİK --- */
        main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: linear-gradient(180deg, #181818 0%, #121212 100%);
        }

        .section-header { margin-bottom: 25px; font-size: 1.3rem; font-weight: 600; color: var(--text-secondary); }

        /* HIZLI BAŞLAT GRİD */
        .quick-launch {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }

        .hero-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .hero-card:hover { transform: translateY(-5px); border-color: #333; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .hero-card .thumb { height: 140px; background: #333; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; }
        .hero-card .info { padding: 12px; font-size: 0.95rem; font-weight: bold; text-align: center; }

        /* KÜTÜPHANE GRİD */
        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .game-poster {
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        .poster-img {
            width: 100%;
            aspect-ratio: 3/4;
            background: #252525;
            border-radius: var(--radius);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #444;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .game-poster:hover .poster-img { transform: scale(1.03); border-color: var(--accent); background: #2a2a2a; }
        .game-poster h4 { font-size: 1rem; margin-bottom: 4px; }
        .game-poster p { color: var(--text-secondary); font-size: 0.8rem; }

        /* --- SAĞ ARKADAŞ PANELİ --- */
        .friends-panel {
            width: 280px;
            background-color: var(--bg-side);
            padding: 20px;
            border-left: 1px solid #252525;
        }

        .friend-list { margin-top: 25px; }
        .friend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: 0.2s;
        }

        .friend-item:hover { background: var(--bg-hover); }

        .avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: #333; display: flex; align-items: center; justify-content: center;
            position: relative; font-weight: bold; font-size: 0.9rem;
        }

        .status {
            width: 12px; height: 12px; border-radius: 50%;
            position: absolute; bottom: 0; right: 0; border: 2.5px solid var(--bg-side);
        }
        .online { background: #31d34c; }
        .playing { background: var(--accent); }

        .friend-info h5 { font-size: 0.9rem; }
        .friend-info p { font-size: 0.75rem; color: var(--text-secondary); }

        /* GİRİŞ EKRANI */
        #auth-screen {
            position: fixed; inset: 0; background: var(--bg-base);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .auth-box { background: var(--bg-card); padding: 40px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .auth-box input { width: 100%; padding: 12px; margin: 10px 0; background: #333; border: 1px solid #444; color: white; border-radius: 4px; }
        .auth-box button { width: 100%; padding: 12px; background: var(--accent); border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <i class="fa-solid fa-cube" style="font-size: 3rem; color: var(--accent); margin-bottom: 20px;"></i>
            <h2 style="margin-bottom:20px; letter-spacing: 1px;">ÖMER STUDIO 3</h2>
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <input type="password" id="password" placeholder="Şifre">
            <button onclick="login()">GİRİŞ YAP</button>
        </div>
    </div>

    <nav class="sidebar hidden" id="main-nav">
        <div class="logo"><i class="fa-solid fa-ghost"></i> OS3 PRO</div>
        <div class="nav-item active" onclick="showTab('home')"><i class="fa-solid fa-house"></i> Ana Sayfa</div>
        <div class="nav-item" onclick="showTab('library')"><i class="fa-solid fa-layer-group"></i> Kütüphane</div>
        <div class="nav-item" onclick="showTab('social')"><i class="fa-solid fa-share-nodes"></i> Sosyal Medya</div>
        <div class="nav-item" onclick="showTab('settings')"><i class="fa-solid fa-gear"></i> Ayarlar</div>
        <div class="nav-item" onclick="logout()" style="margin-top:auto; color:#ff4757;"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</div>
    </nav>

    <main class="hidden" id="main-content">
        
        <div id="home-tab">
            <h2 class="section-header">Hızlı Başlat</h2>
            <div class="quick-launch">
                <div class="hero-card" onclick="window.open('omercraft_plus.html', '_blank')">
                    <div class="thumb" style="background-image: url('https://files.freeminecraftmaps.com/images/default-thumbnail.jpg');">
                        <i class="fa-solid fa-play" style="font-size: 2rem; opacity: 0.8;"></i>
                    </div>
                    <div class="info">ÖmerCraft PLUS</div>
                </div>
                <div class="hero-card" onclick="window.open('https://omerfarukevran430-ctrl.github.io/Tekin-prototip/', '_blank')">
                    <div class="thumb" style="background: linear-gradient(45deg, #b71c1c, #4a148c);">
                        <i class="fa-solid fa-flask" style="font-size: 2rem;"></i>
                    </div>
                    <div class="info">TekinZOR Prototip</div>
                </div>
                <div class="hero-card" onclick="window.open('https://omerfarukevran430-ctrl.github.io/aftg/', '_blank')">
                    <div class="thumb" style="background: linear-gradient(45deg, #2e7d32, #1b5e20);">
                        <i class="fa-solid fa-check-to-slot" style="font-size: 2rem;"></i>
                    </div>
                    <div class="info">Seçim Craft</div>
                </div>
            </div>

            <h2 class="section-header">Ömer Studio Koleksiyonu</h2>
            <div class="library-grid" id="game-list">
                </div>
        </div>

    </main>

    <aside class="friends-panel hidden" id="friends-nav">
        <div style="display:flex; justify-content:space-between; align-items:center; font-weight: bold; font-size: 0.8rem; color: var(--text-secondary);">
            <span>ARKADAŞLAR (3)</span>
            <i class="fa-solid fa-user-plus" style="cursor:pointer;"></i>
        </div>
        
        <div class="friend-list">
            <div class="friend-item">
                <div class="avatar" style="background: #0078f2; color: white;">T <div class="status online"></div></div>
                <div class="friend-info"><h5>Tekinişko</h5><p>Çevrimiçi</p></div>
            </div>
            <div class="friend-item">
                <div class="avatar" style="background: #6a1b9a; color: white;">B <div class="status playing"></div></div>
                <div class="friend-info"><h5>TheBaddking</h5><p>ÖmerCraft PLUS Oynuyor</p></div>
            </div>
            <div class="friend-item">
                <div class="avatar" style="background: #37474f; color: var(--text-secondary);">F</div>
                <div class="friend-info"><h5>Faruk_07</h5><p style="color: #666;">Çevrimdışı</p></div>
            </div>
        </div>
    </aside>

    <script>
        // SADECE SENİN OYUNLARIN
        const myGames = [
            { name: "ÖmerCraft PLUS", cat: "3D Sandbox", url: "omercraft_plus.html", icon: "fa-cube", color: "#8b5a2b" },
            { name: "100 Days", cat: "Survival", url: "https://codepen.io/-mer-faruk-evran-the-animator/pen/LERKGwb", icon: "fa-hourglass-half", color: "#e65100" },
            { name: "Seçim Craft", cat: "Simülasyon", url: "https://omerfarukevran430-ctrl.github.io/aftg/", icon: "fa-check-to-slot", color: "#2e7d32" },
            { name: "Click Man", cat: "Clicker", url: "https://omerfarukevran430-ctrl.github.io/Click-Man/", icon: "fa-mouse", color: "#0277bd" },
            { name: "No Escape", cat: "Korku / Aksiyon", url: "https://omerfarukevran430-ctrl.github.io/ads-z/", icon: "fa-door-closed", color: "#c62828" },
            { name: "Ömercraft Classic", cat: "Klasik", url: "https://omerfarukevran430-ctrl.github.io/omercraft/", icon: "fa-block-brick", color: "#5d4037" },
            { name: "TekinZOR Prototip", cat: "Geliştirme Aşamasında", url: "https://omerfarukevran430-ctrl.github.io/Tekin-prototip/", icon: "fa-flask", color: "#4527a0" }
        ];

        function login() {
            const u = document.getElementById('username').value;
            if(!u) return alert("Lütfen bir kullanıcı adı girin.");
            localStorage.setItem("osUser", u);
            document.getElementById('auth-screen').classList.add('hidden');
            document.querySelectorAll('.hidden').forEach(el => el.classList.remove('hidden'));
            loadGames();
        }

        function loadGames() {
            const container = document.getElementById('game-list');
            container.innerHTML = "";
            myGames.forEach(g => {
                container.innerHTML += `
                    <a href="${g.url}" target="_blank" class="game-poster">
                        <div class="poster-img" style="color: ${g.color}"><i class="fa-solid ${g.icon}"></i></div>
                        <h4>${g.name}</h4>
                        <p>${g.cat}</p>
                    </a>
                `;
            });
        }

        function logout() {
            localStorage.removeItem("osUser");
            location.reload();
        }

        // Oturum Kontrolü
        if(localStorage.getItem("osUser")) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-nav').classList.remove('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('friends-nav').classList.remove('hidden');
            loadGames();
        }
    </script>
</body>
</html>
